[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyedelog"
version = "0.1.0"
description = "Safe Python client for EDELOG Data Sync"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Linus Hoppe" }
]
keywords = ["edelog", "data-sync", "integration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/linus-code-h/pyedelog"
Repository = "https://github.com/linus-code-h/pyedelog"
Issues = "https://github.com/linus-code-h/pyedelog/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "build>=1,<2",
    "hatchling>=1,<2",
    "ruff>=0.9,<1",
    "mypy>=1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/edelog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src/edelog"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
