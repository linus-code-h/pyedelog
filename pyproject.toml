[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyedelog"
version = "0.1.0"
description = "Python client for EDELOG"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Linus Hoppe" }
]

dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "build>=1,<2",
    "hatchling>=1,<2",
    "ruff>=0.9,<1",
    "mypy>=1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/edelog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src/edelog"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
